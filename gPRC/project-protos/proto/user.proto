syntax = "proto3";
package user;
import "google/protobuf/empty.proto";
option go_package = "github.com/guarref/project-protos/proto/user";


// Сущность пользователь (минимум полей)
message User {
  uint32 id    = 1;
  string email = 2;
}

// Запрос на создание
message CreateUserRequest {
  string email = 1;
}
message CreateUserResponse {
  User user = 1;
}

// запрос на изменение
message UpdateUserRequest {
    uint32 id = 1;
    string email = 2; // проверить на сервере
}
message UpdateUserResponse {
    User user = 1;
}

// запрос на удаление, а он нам и не нужен наверное

// запрос на лист
message ListUsersRequest {}
message ListUsersResponse {
    repeated User users = 1;
}

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser    (User)              returns (User);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (User)              returns (google.protobuf.Empty);
  rpc ListUsers  (ListUsersRequest)  returns (ListUsersResponse);
}